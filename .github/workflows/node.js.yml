name: Node.js CI

on:
  push:
    branches: ["main", "hardening/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: tubematex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node.js 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar configuração Docker Compose e construir proxy SSRF
        run: |
          cp backend/.env.example backend/.env
          export REDIS_PASSWORD=test-only
          docker compose config -q
          docker compose build egress-proxy

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Instalar dependências de forma reprodutível
        run: npm ci

      - name: Instalar dependências do backend Docker
        run: npm ci --prefix backend

      - name: Auditar dependências da raiz (informativo)
        run: npm audit
        continue-on-error: true

      - name: Auditar dependências do backend Docker (informativo)
        run: npm audit --prefix backend
        continue-on-error: true

      - name: Verificar sintaxe do backend
        run: node --check backend/server.js

      - name: Executar testes unitários e de contrato
        run: npm test

      - name: Verificar estrutura e acessibilidade
        run: npm run test:accessibility

      - name: Verificar contraste dos tokens
        run: npm run test:contrast

      - name: Verificar governança do design system
        run: npm run test:design-system
